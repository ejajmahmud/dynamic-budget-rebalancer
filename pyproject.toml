[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-budget-rebalancer"
version = "0.1.0"
description = "Real-time token budget governor shifting unused reasoning tokens between planning, execution, and verification phases"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
dynamic-budget-rebalancer = "dynamic_budget_rebalancer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dynamic_budget_rebalancer*"]
